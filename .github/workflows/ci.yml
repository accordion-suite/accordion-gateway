name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: accordion-suite/accordion/.github/workflows/rust.yml@main

  # Gets real certificates from Pebble, Let's Encrypt's test certificate
  # authority. Only this repo needs it, so it isn't in the shared workflow.
  acme:
    name: ACME against Pebble
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pinned as in the shared workflow, which explains why.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The same connection check as the shared workflow's tests.
      - name: Install strace
        run: |
          if ! command -v strace > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q strace
          fi
      - name: Get the connection check
        uses: actions/checkout@v7
        with:
          repository: accordion-suite/accordion
          path: .accordion-ci
          sparse-checkout: scripts/check-connections.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: scripts/test-acme.sh
        env:
          CONNECTION_CHECK: .accordion-ci/scripts/check-connections.py
