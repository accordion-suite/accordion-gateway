[package]
name = "accordion-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
gotatun = { version = "0.10.2", default-features = false, features = ["device", "ring"] }
hickory-resolver = "0.26.3"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "rustls-platform-verifier"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "server-auto", "service", "tokio"] }
if-addrs = "0.15.0"
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
ipnetwork = "0.21.1"
mdns-sd = "0.21.5"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tower = "0.5.3"
tracing = "0.1.44"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["io-util", "rt-multi-thread", "test-util"] }
